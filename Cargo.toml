[package]
name = "allergen-labels"
version = "1.0.0"
edition = "2021"
description = "Prints product ingredient labels (allergens in bold) from a spreadsheet to a Star TSP100III"

[[bin]]
name = "AllergenLabels"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
