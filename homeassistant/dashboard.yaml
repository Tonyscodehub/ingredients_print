# Home Assistant dashboard for a 1920 x 1080 screen: the Remootio gate bar across
# the top, and the allergen label app filling the rest.
#
# To use it: Settings → Dashboards → Add dashboard → "New dashboard from scratch",
# open it, ⋮ → Edit dashboard → ⋮ → Raw configuration editor, paste this in, and
# check the entity ID and URL below match your setup.

title: PoFfles
views:
  - title: Labels
    path: labels
    icon: mdi:label-outline
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: tile
            entity: cover.remootio_device_host_192_168_1_16_s_n_083af20d23c4byyrkdpy_none   # Remootio
            name: Gate
            icon: mdi:gate
            vertical: true           # icon, name, and Open/Closed centred, compact
            # One tap opens or closes the gate; press and hold for the full controls.
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: iframe
            # Served through HAProxy on OPNsense with the *.johncock.co.uk certificate (LAN only).
            url: https://labels.johncock.co.uk/?embed=1
            # Height as a percentage of width, so the page never scrolls. 40% suits a
            # 1920 x 1080 screen with a maximised browser (address bar showing) and the
            # HA sidebar as icons only. Raise it if there's a gap at the bottom, lower it
            # if the dashboard scrolls.
            aspect_ratio: 40%
